name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Arch Linux
        run: |
          pacman -Syu --noconfirm --needed git namcap
          useradd --create-home builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared dependencies
        run: |
          source pkgbuild/PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}" "${checkdepends[@]}"
      - name: Build and test as an unprivileged user
        run: |
          version=$(sed -n 's/^pkgver=//p' pkgbuild/PKGBUILD)
          mkdir -p /home/builder/package
          archive="keymarchy-$version.tar.gz"
          git -c safe.directory="$GITHUB_WORKSPACE" archive --prefix="keymarchy-$version/" HEAD | gzip -n > "/home/builder/package/$archive"
          checksum=$(sha256sum "/home/builder/package/$archive" | cut -d ' ' -f 1)
          cp pkgbuild/PKGBUILD /home/builder/package/PKGBUILD
          sed -i 's|\$startdir/..|$srcdir/$pkgname-$pkgver|g; s|source=()|source=("$pkgname-$pkgver.tar.gz")|' /home/builder/package/PKGBUILD
          sed -i "s/sha256sums=()/sha256sums=('$checksum')/" /home/builder/package/PKGBUILD
          chown -R builder:builder /home/builder/package
          runuser -u builder -- bash -c 'cd /home/builder/package && makepkg --noconfirm'
      - name: Inspect package
        run: |
          cd /home/builder/package
          namcap PKGBUILD keymarchy-*.pkg.tar.zst | tee /tmp/namcap.log
          if grep -q ' E: ' /tmp/namcap.log; then exit 1; fi
          pacman -U --noconfirm keymarchy-*.pkg.tar.zst
          keymarchy --help
          test -x /usr/lib/keymarchy/keymarchy-helper
          test -f /usr/share/polkit-1/actions/io.github.razumasu.keymarchy.policy
          test -f /usr/share/applications/keymarchy.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/keymarchy.svg
